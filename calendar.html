<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>캘린더</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f8f9fa;
    --border: #dadce0;
    --border-soft: #e8eaed;
    --text: #202124;
    --text-2: #5f6368;
    --text-3: #80868b;
    --accent: #1a73e8;
    --accent-soft: #e8f0fe;
    --danger: #d93025;
    --shadow: 0 1px 3px rgba(60,64,67,.15), 0 4px 12px rgba(60,64,67,.12);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --surface: #1f2023;
      --surface-2: #26282c;
      --border: #3c4043;
      --border-soft: #2e3134;
      --text: #e8eaed;
      --text-2: #9aa0a6;
      --text-3: #7f858a;
      --accent: #8ab4f8;
      --accent-soft: #1f3145;
      --danger: #f28b82;
      --shadow: 0 1px 3px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.4);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont,
                 "Segoe UI", Roboto, "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea, select { font: inherit; color: inherit; }

  .app { display: flex; flex-direction: column; height: 100vh; }
  .app[hidden] { display: none; }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border-soft);
    background: var(--surface);
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 500; margin-right: 6px; }
  .brand .logo { font-size: 22px; }
  #title { font-size: 20px; font-weight: 500; margin: 0 4px; letter-spacing: -.2px; white-space: nowrap; }
  .spacer { flex: 1; }

  .btn {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 999px;
    padding: 7px 15px;
    cursor: pointer;
    transition: background .15s, box-shadow .15s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary {
    border: none; background: var(--accent); color: #fff; font-weight: 500;
    box-shadow: var(--shadow); padding: 9px 18px;
  }
  @media (prefers-color-scheme: dark) { .btn.primary { color: #17181a; } }
  .btn.primary:hover { filter: brightness(1.05); }
  .iconbtn {
    width: 34px; height: 34px; border-radius: 50%; border: none;
    background: transparent; cursor: pointer; font-size: 18px; line-height: 1;
    color: var(--text-2);
  }
  .iconbtn:hover { background: var(--surface-2); }
  .avatarbtn {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, var(--accent), #7c4dff);
    color: #fff; font-weight: 700; cursor: pointer; box-shadow: var(--shadow);
  }
  .avatarbtn:hover { filter: brightness(1.05); }

  .search {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface-2); border: 1px solid transparent;
    border-radius: 999px; padding: 6px 14px; min-width: 200px;
  }
  .search:focus-within { border-color: var(--border); background: var(--surface); }
  .search input { border: none; background: transparent; outline: none; width: 100%; }

  /* ---------- Layout ---------- */
  .body { display: flex; flex: 1; min-height: 0; }

  .sidebar {
    width: 250px; flex: none; padding: 16px 14px;
    border-right: 1px solid var(--border-soft);
    overflow-y: auto;
  }

  /* mini calendar */
  .mini-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .mini-head span { font-weight: 500; }
  .mini-head .iconbtn { width: 28px; height: 28px; font-size: 15px; }
  .mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
  .mini-grid .wd { text-align: center; font-size: 11px; color: var(--text-3); padding: 4px 0; }
  .mini-grid button {
    aspect-ratio: 1; border: none; background: transparent; border-radius: 50%;
    font-size: 12px; cursor: pointer; color: var(--text); position: relative;
  }
  .mini-grid button:hover { background: var(--surface-2); }
  .mini-grid button.out { color: var(--text-3); opacity: .55; }
  .mini-grid button.today { background: var(--accent); color: #fff; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .mini-grid button.today { color: #17181a; } }
  .mini-grid button.sel { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .mini-grid button.has::after {
    content: ""; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
    width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .7;
  }

  .side-section { margin-top: 24px; }
  .side-section h2 { font-size: 12px; letter-spacing: .5px; color: var(--text-2); margin: 0 0 10px; font-weight: 600; }
  .upcoming { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .upcoming li button {
    width: 100%; text-align: left; border: none; background: transparent; cursor: pointer;
    padding: 7px 8px; border-radius: 8px; display: flex; gap: 8px; align-items: flex-start;
  }
  .upcoming li button:hover { background: var(--surface-2); }
  .upcoming .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex: none; }
  .upcoming .t { font-weight: 500; display: block; line-height: 1.35; }
  .upcoming .m { color: var(--text-2); font-size: 12px; }
  .empty { color: var(--text-3); font-size: 13px; padding: 6px 8px; }

  /* ---------- Calendar grid ---------- */
  .cal { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 8px 12px 12px; }
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); }
  .weekdays div {
    text-align: center; font-size: 11px; font-weight: 600; letter-spacing: .6px;
    color: var(--text-2); padding: 8px 0;
  }
  .weekdays div.sun { color: #d93025; }
  .weekdays div.sat { color: #1a73e8; }

  .grid {
    flex: 1; display: grid; grid-template-columns: repeat(7, 1fr);
    border-top: 1px solid var(--border-soft); border-left: 1px solid var(--border-soft);
    border-radius: 2px; min-height: 0;
  }
  .cell {
    border-right: 1px solid var(--border-soft); border-bottom: 1px solid var(--border-soft);
    padding: 4px 4px 6px; min-height: 0; overflow: hidden;
    display: flex; flex-direction: column; gap: 2px; cursor: pointer; position: relative;
  }
  .cell:hover { background: var(--surface-2); }
  .cell.out .daynum { color: var(--text-3); opacity: .5; }
  .cell.drop { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
  .daynum {
    align-self: center; font-size: 12px; font-weight: 500; color: var(--text-2);
    width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 50%;
    margin-bottom: 2px; flex: none;
  }
  .cell.today .daynum { background: var(--accent); color: #fff; font-weight: 700; }
  @media (prefers-color-scheme: dark) { .cell.today .daynum { color: #17181a; } }
  .cell .events { display: flex; flex-direction: column; gap: 2px; overflow: hidden; min-height: 0; }

  .chip {
    display: flex; align-items: center; gap: 5px;
    padding: 2px 6px; border-radius: 5px; font-size: 12px; line-height: 1.5;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
    border: none; width: 100%; text-align: left; background: transparent; color: var(--text);
  }
  .chip:hover { background: var(--surface-2); filter: brightness(.97); }
  .chip.solid { color: #fff; font-weight: 500; }
  .chip.solid:hover { filter: brightness(1.08); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .chip .time { color: var(--text-2); font-variant-numeric: tabular-nums; }
  .chip .name { overflow: hidden; text-overflow: ellipsis; }
  .chip.dim { opacity: .28; }
  .more { font-size: 11px; color: var(--text-2); padding: 1px 6px; border: none; background: transparent; text-align: left; cursor: pointer; border-radius: 5px; }
  .more:hover { background: var(--surface-2); }

  /* ---------- Modal ---------- */
  .backdrop {
    position: fixed; inset: 0; background: rgba(32,33,36,.5);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .backdrop.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 14px; box-shadow: var(--shadow);
    width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto;
    border: 1px solid var(--border-soft);
  }
  .modal header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px 6px;
  }
  .modal header h2 { margin: 0; font-size: 17px; font-weight: 500; }
  .modal .content { padding: 6px 18px 4px; display: flex; flex-direction: column; gap: 14px; }
  .modal footer {
    display: flex; align-items: center; gap: 8px; padding: 14px 18px 18px;
  }
  .modal footer .spacer { flex: 1; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; color: var(--text-2); }
  .input {
    border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
    padding: 9px 11px; outline: none; width: 100%;
  }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  #f-title { font-size: 18px; border: none; border-bottom: 2px solid var(--border); border-radius: 0; padding: 8px 2px; }
  #f-title:focus { border-bottom-color: var(--accent); box-shadow: none; }
  textarea.input { resize: vertical; min-height: 64px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .check { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; color: var(--text-2); }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }

  .colors { display: flex; gap: 8px; flex-wrap: wrap; }
  .colors button {
    width: 26px; height: 26px; border-radius: 50%; border: none; cursor: pointer; position: relative;
  }
  .colors button[aria-checked="true"]::after {
    content: "✓"; position: absolute; inset: 0; display: grid; place-items: center;
    color: #fff; font-size: 14px; font-weight: 700;
  }
  .colors button[aria-checked="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }

  .error { color: var(--danger); font-size: 12px; min-height: 16px; }
  .link { border: none; background: transparent; color: var(--danger); cursor: pointer; padding: 8px 10px; border-radius: 8px; }
  .link:hover { background: var(--surface-2); }

  /* day detail list */
  .daylist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .daylist li button {
    width: 100%; text-align: left; border: none; background: var(--surface-2); cursor: pointer;
    padding: 10px 12px; border-radius: 9px; display: flex; gap: 10px; align-items: flex-start;
  }
  .daylist li button:hover { filter: brightness(.97); }
  .daylist .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex: none; }
  .daylist .t { font-weight: 500; }
  .daylist .m { color: var(--text-2); font-size: 12px; }

  .hint { color: var(--text-3); font-size: 11.5px; text-align: right; padding: 0 16px 8px; }

  /* ---------- 로그인 / 회원가입 ---------- */
  .auth {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    background:
      radial-gradient(900px 500px at 12% -10%, var(--accent-soft), transparent 60%),
      radial-gradient(700px 460px at 100% 110%, var(--accent-soft), transparent 60%),
      var(--bg);
    overflow-y: auto;
  }
  .auth[hidden] { display: none; }
  .auth-card {
    width: 100%; max-width: 380px;
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: 16px; box-shadow: var(--shadow); padding: 26px 24px 22px;
  }
  .auth-brand { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 600; }
  .auth-sub { color: var(--text-2); margin: 6px 0 18px; font-size: 13px; }

  .tabs {
    display: flex; gap: 4px; background: var(--surface-2);
    border-radius: 999px; padding: 4px; margin-bottom: 18px;
  }
  .tabs button {
    flex: 1; border: none; background: transparent; color: var(--text-2);
    padding: 8px 10px; border-radius: 999px; cursor: pointer; font-weight: 500;
  }
  .tabs button[aria-selected="true"] {
    background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.14);
  }

  .auth form { display: flex; flex-direction: column; gap: 13px; }
  .auth form[hidden] { display: none; }
  .auth .btn.primary { width: 100%; justify-content: center; padding: 11px 18px; margin-top: 3px; }
  .auth .btn.primary:disabled { opacity: .6; cursor: default; }
  .auth .error { min-height: 18px; line-height: 1.4; }
  .auth-foot { margin-top: 14px; color: var(--text-3); font-size: 11.5px; line-height: 1.55; }

  /* 사용자 칩 */
  .userchip {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 6px 4px 4px;
  }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff;
    display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none;
  }
  @media (prefers-color-scheme: dark) { .avatar { color: #17181a; } }
  .userchip .who { font-size: 13px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .userchip .out { border: none; background: transparent; color: var(--text-2); cursor: pointer; font-size: 12px; padding: 4px 8px; border-radius: 999px; }
  .userchip .out:hover { background: var(--surface-2); color: var(--text); }

  @media (max-width: 900px) {
    .sidebar { display: none; }
    .search { display: none; }
    .brand span { display: none; }
    .userchip .who { display: none; }
  }
</style>
</head>
<body>
<!-- 로그인 / 회원가입 -->
<div class="auth" id="authScreen">
  <div class="auth-card">
    <div class="auth-brand"><span>📅</span><span>캘린더</span></div>
    <p class="auth-sub" id="authSub">내 일정을 안전하게 나만의 공간에서 관리하세요.</p>

    <div class="tabs" role="tablist">
      <button type="button" id="tabLogin" role="tab" aria-selected="true">로그인</button>
      <button type="button" id="tabSignup" role="tab" aria-selected="false">회원가입</button>
    </div>

    <!-- 로그인 -->
    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="li-id">아이디</label>
        <input class="input" id="li-id" name="username" autocomplete="username" maxlength="20" required />
      </div>
      <div class="field">
        <label for="li-pw">비밀번호</label>
        <input class="input" id="li-pw" name="password" type="password" autocomplete="current-password" required />
      </div>
      <label class="check"><input type="checkbox" id="li-keep" checked /> 로그인 상태 유지</label>
      <div class="error" id="li-error"></div>
      <button class="btn primary" type="submit">로그인</button>
    </form>

    <!-- 회원가입 -->
    <form id="signupForm" autocomplete="on" hidden>
      <div class="field">
        <label for="su-id">아이디</label>
        <input class="input" id="su-id" name="username" autocomplete="username" maxlength="20"
               placeholder="영문·숫자·밑줄 3~20자" required />
      </div>
      <div class="field">
        <label for="su-pw">비밀번호</label>
        <input class="input" id="su-pw" name="password" type="password" autocomplete="new-password"
               placeholder="6자 이상" required />
      </div>
      <div class="field">
        <label for="su-pw2">비밀번호 확인</label>
        <input class="input" id="su-pw2" name="password2" type="password" autocomplete="new-password" required />
      </div>
      <div class="error" id="su-error"></div>
      <button class="btn primary" type="submit">가입하고 시작하기</button>
    </form>

    <p class="auth-foot">
      계정과 일정은 이 브라우저에만 저장됩니다. 다른 기기와 동기화되지 않으며,
      브라우저 데이터를 지우면 함께 삭제됩니다. 중요한 비밀번호는 사용하지 마세요.
    </p>
  </div>
</div>

<div class="app" id="app" hidden>
  <div class="topbar">
    <div class="brand"><span class="logo">📅</span><span>캘린더</span></div>
    <button class="btn" id="todayBtn">오늘</button>
    <button class="iconbtn" id="prevBtn" title="이전 달 (←)">‹</button>
    <button class="iconbtn" id="nextBtn" title="다음 달 (→)">›</button>
    <h1 id="title"></h1>
    <div class="spacer"></div>
    <div class="search">
      <span>🔍</span>
      <input id="search" type="search" placeholder="일정 검색" />
    </div>
    <button class="avatarbtn" id="profileBtn" title="Google Calendar 설정">Y</button>
    <button class="btn primary" id="createBtn">＋ 만들기</button>
    <div class="userchip">
      <span class="avatar" id="userAvatar"></span>
      <span class="who" id="userName"></span>
      <button class="out" id="logoutBtn" type="button">로그아웃</button>
    </div>
  </div>

  <div class="body">
    <aside class="sidebar">
      <div class="mini-head">
        <span id="miniTitle"></span>
        <div>
          <button class="iconbtn" id="miniPrev">‹</button>
          <button class="iconbtn" id="miniNext">›</button>
        </div>
      </div>
      <div class="mini-grid" id="miniGrid"></div>

      <div class="side-section">
        <h2>다가오는 일정</h2>
        <ul class="upcoming" id="upcomingList"></ul>
      </div>
    </aside>

    <main class="cal">
      <div class="weekdays" id="weekdays"></div>
      <div class="grid" id="grid"></div>
    </main>
  </div>
</div>

<!-- 일정 편집 모달 -->
<div class="backdrop" id="editBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <header>
      <h2 id="editTitle">일정 추가</h2>
      <button class="iconbtn" data-close>✕</button>
    </header>
    <form id="editForm" class="content" autocomplete="off">
      <input class="input" id="f-title" placeholder="제목 추가" maxlength="120" />

      <label class="check"><input type="checkbox" id="f-allday" /> 하루 종일</label>

      <div class="row">
        <div class="field">
          <label for="f-date">날짜</label>
          <input class="input" type="date" id="f-date" required />
        </div>
        <div class="field" id="startWrap">
          <label for="f-start">시작</label>
          <input class="input" type="time" id="f-start" step="300" />
        </div>
        <div class="field" id="endWrap">
          <label for="f-end">종료</label>
          <input class="input" type="time" id="f-end" step="300" />
        </div>
      </div>

      <div class="field">
        <label>색상</label>
        <div class="colors" id="f-colors" role="radiogroup"></div>
      </div>

      <div class="field">
        <label for="f-desc">메모</label>
        <textarea class="input" id="f-desc" placeholder="설명, 장소 등"></textarea>
      </div>

      <div class="error" id="f-error"></div>
    </form>
    <footer>
      <button class="link" id="deleteBtn" type="button" hidden>삭제</button>
      <div class="spacer"></div>
      <button class="btn" type="button" data-close>취소</button>
      <button class="btn primary" type="submit" form="editForm">저장</button>
    </footer>
  </div>
</div>

<!-- 하루 일정 목록 모달 -->
<div class="backdrop" id="dayBackdrop">
  <div class="modal" role="dialog" aria-modal="true" style="max-width:380px">
    <header>
      <h2 id="dayTitle"></h2>
      <button class="iconbtn" data-close>✕</button>
    </header>
    <div class="content">
      <ul class="daylist" id="dayList"></ul>
    </div>
    <footer>
      <div class="spacer"></div>
      <button class="btn primary" id="dayAddBtn" type="button">＋ 일정 추가</button>
    </footer>
  </div>
</div>

<!-- Google Calendar 설정 모달 -->
<div class="backdrop" id="settingsBackdrop">
  <div class="modal" role="dialog" aria-modal="true" style="max-width:460px">
    <header>
      <h2>Google Calendar 설정</h2>
      <button class="iconbtn" data-close>✕</button>
    </header>
    <div class="content">
      <div class="field">
        <label for="googleClientId">Google API Client ID</label>
        <input class="input" id="googleClientId" placeholder="예: 1234567890-abc123.apps.googleusercontent.com" />
      </div>
      <div class="field">
        <label for="googleCalendarId">Google Calendar ID</label>
        <input class="input" id="googleCalendarId" placeholder="예: primary 또는 캘린더 이메일" />
      </div>
      <div class="hint" style="text-align:left;padding:0">Google는 비밀번호로 연결하지 않습니다. 아래 버튼으로 Google 계정 권한을 승인하면 일정이 안전하게 가져와집니다.</div>
      <div class="error" id="googleStatus">연결 전입니다.</div>
    </div>
    <footer>
      <button class="btn" id="googleDisconnectBtn" type="button">연결 해제</button>
      <div class="spacer"></div>
      <button class="btn primary" id="googleConnectBtn" type="button">Google 연결</button>
    </footer>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function () {
  "use strict";

  // ---------- 상수 ----------
  const LEGACY_STORE_KEY = "simple-calendar-events-v1";        // 로그인 도입 이전 데이터
  const USERS_KEY = "simple-calendar-users-v1";
  const SESSION_KEY = "simple-calendar-session-v1";
  const GOOGLE_CONFIG_KEY = "simple-calendar-google-config-v1";
  const storeKeyFor = (id) => `${LEGACY_STORE_KEY}:${id}`;
  const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];
  const COLORS = [
    { id: "blue",     hex: "#1a73e8", name: "블루" },
    { id: "green",    hex: "#33b679", name: "세이지" },
    { id: "red",      hex: "#d50000", name: "토마토" },
    { id: "orange",   hex: "#f4511e", name: "탠저린" },
    { id: "yellow",   hex: "#f6bf26", name: "바나나" },
    { id: "purple",   hex: "#8e24aa", name: "포도" },
    { id: "indigo",   hex: "#3f51b5", name: "블루베리" },
    { id: "graphite", hex: "#616161", name: "그래파이트" }
  ];
  const colorHex = (id) => (COLORS.find((c) => c.id === id) || COLORS[0]).hex;

  // ---------- 날짜 유틸 ----------
  const pad = (n) => String(n).padStart(2, "0");
  const key = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseKey = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const todayKey = () => key(new Date());
  const addMonths = (d, n) => new Date(d.getFullYear(), d.getMonth() + n, 1);
  const fmtTime = (t) => {
    if (!t) return "";
    const [h, m] = t.split(":").map(Number);
    const ampm = h < 12 ? "오전" : "오후";
    const hh = h % 12 === 0 ? 12 : h % 12;
    return m === 0 ? `${ampm} ${hh}시` : `${ampm} ${hh}:${pad(m)}`;
  };
  const fmtDateLong = (s) => {
    const d = parseKey(s);
    return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEKDAYS[d.getDay()]})`;
  };
  const roundTime = (d) => `${pad(d.getHours())}:${pad(Math.floor(d.getMinutes() / 30) * 30)}`;
  const plusHour = (t) => {
    const [h, m] = t.split(":").map(Number);
    return `${pad((h + 1) % 24)}:${pad(m)}`;
  };

  // ---------- 상태 ----------
  // uid 는 load()/seed() 보다 먼저 필요하므로 호이스팅되는 함수 선언으로 둔다.
  function uid() { return Math.random().toString(36).slice(2, 10); }

  let currentUser = null;               // 로그인한 사용자 아이디 (소문자 정규화)
  let events = [];
  let viewDate = new Date();            // 큰 달력이 보여주는 달
  let miniDate = new Date();            // 미니 달력이 보여주는 달
  let selectedKey = todayKey();
  let query = "";
  let editingId = null;
  let formColor = "blue";
  let googleConfig = loadGoogleConfig();
  let googleAccessToken = null;
  let googleTokenClient = null;

  function load() {
    if (!currentUser) return [];
    try {
      const raw = localStorage.getItem(storeKeyFor(currentUser));
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) { /* 저장소를 못 읽으면 새로 시작 */ }
    return seed();
  }
  function save() {
    if (!currentUser) return;
    try { localStorage.setItem(storeKeyFor(currentUser), JSON.stringify(events)); } catch (e) {}
  }
  function loadGoogleConfig() {
    try {
      const raw = localStorage.getItem(GOOGLE_CONFIG_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { clientId: "", calendarId: "primary", connected: false };
  }
  function saveGoogleConfig() {
    try { localStorage.setItem(GOOGLE_CONFIG_KEY, JSON.stringify(googleConfig)); } catch (e) {}
  }
  function seed() {
    const t = todayKey();
    return [
      { id: uid(), title: "👋 일정을 클릭하면 수정할 수 있어요", date: t, allDay: true, start: "", end: "", color: "green", desc: "빈 날짜를 클릭하면 새 일정이 추가됩니다. 드래그해서 날짜를 옮길 수도 있어요." },
      { id: uid(), title: "팀 회의", date: t, allDay: false, start: "14:00", end: "15:00", color: "blue", desc: "" }
    ];
  }

  function eventsOn(dateKey) {
    return events
      .filter((e) => e.date === dateKey)
      .sort((a, b) => {
        if (a.allDay !== b.allDay) return a.allDay ? -1 : 1;
        return (a.start || "").localeCompare(b.start || "");
      });
  }
  const matches = (e) => {
    if (!query) return true;
    const q = query.toLowerCase();
    return (e.title || "").toLowerCase().includes(q) || (e.desc || "").toLowerCase().includes(q);
  };

  // ---------- DOM ----------
  const $ = (s) => document.querySelector(s);
  const grid = $("#grid"), titleEl = $("#title");
  const miniGrid = $("#miniGrid"), miniTitle = $("#miniTitle");
  const upcomingList = $("#upcomingList");
  const editBackdrop = $("#editBackdrop"), dayBackdrop = $("#dayBackdrop"), settingsBackdrop = $("#settingsBackdrop");
  const googleClientIdInput = $("#googleClientId"), googleCalendarIdInput = $("#googleCalendarId");
  const googleStatusEl = $("#googleStatus");

  // 요일 헤더
  $("#weekdays").innerHTML = WEEKDAYS
    .map((w, i) => `<div class="${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${w}</div>`)
    .join("");

  // ---------- 렌더 ----------
  function render() {
    renderGrid();
    renderMini();
    renderUpcoming();
  }

  function monthCells(base) {
    const y = base.getFullYear(), m = base.getMonth();
    const first = new Date(y, m, 1);
    const start = new Date(y, m, 1 - first.getDay());
    const days = new Date(y, m + 1, 0).getDate();
    const weeks = Math.ceil((first.getDay() + days) / 7);
    const cells = [];
    for (let i = 0; i < weeks * 7; i++) {
      cells.push(new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
    }
    return cells;
  }

  function renderGrid() {
    titleEl.textContent = `${viewDate.getFullYear()}년 ${viewDate.getMonth() + 1}월`;
    const cells = monthCells(viewDate);
    grid.style.gridTemplateRows = `repeat(${cells.length / 7}, minmax(0, 1fr))`;
    grid.innerHTML = "";

    const tk = todayKey();
    cells.forEach((d) => {
      const k = key(d);
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.date = k;
      if (d.getMonth() !== viewDate.getMonth()) cell.classList.add("out");
      if (k === tk) cell.classList.add("today");

      const num = document.createElement("div");
      num.className = "daynum";
      num.textContent = d.getDate() === 1 ? `${d.getMonth() + 1}월 1일` : d.getDate();
      if (d.getDate() === 1) { num.style.width = "auto"; num.style.padding = "0 8px"; }
      cell.appendChild(num);

      const list = document.createElement("div");
      list.className = "events";
      const dayEvents = eventsOn(k);
      const MAX = 3;
      dayEvents.slice(0, MAX).forEach((e) => list.appendChild(chip(e)));
      if (dayEvents.length > MAX) {
        const more = document.createElement("button");
        more.className = "more";
        more.textContent = `+${dayEvents.length - MAX}개 더보기`;
        more.addEventListener("click", (ev) => { ev.stopPropagation(); openDay(k); });
        list.appendChild(more);
      }
      cell.appendChild(list);

      cell.addEventListener("click", () => openEdit(null, k));
      cell.addEventListener("dragover", (ev) => { ev.preventDefault(); cell.classList.add("drop"); });
      cell.addEventListener("dragleave", () => cell.classList.remove("drop"));
      cell.addEventListener("drop", (ev) => {
        ev.preventDefault();
        cell.classList.remove("drop");
        const id = ev.dataTransfer.getData("text/plain");
        const target = events.find((x) => x.id === id);
        if (target && target.date !== k) { target.date = k; save(); render(); }
      });

      grid.appendChild(cell);
    });
  }

  function chip(e) {
    const b = document.createElement("button");
    b.className = "chip" + (e.allDay ? " solid" : "") + (matches(e) ? "" : " dim");
    b.draggable = true;
    b.title = e.title || "(제목 없음)";
    if (e.allDay) {
      b.style.background = colorHex(e.color);
      b.innerHTML = `<span class="name"></span>`;
    } else {
      b.innerHTML = `<span class="dot"></span><span class="time"></span><span class="name"></span>`;
      b.querySelector(".dot").style.background = colorHex(e.color);
      b.querySelector(".time").textContent = fmtTime(e.start);
    }
    b.querySelector(".name").textContent = e.title || "(제목 없음)";
    b.addEventListener("click", (ev) => { ev.stopPropagation(); openEdit(e.id); });
    b.addEventListener("dragstart", (ev) => ev.dataTransfer.setData("text/plain", e.id));
    return b;
  }

  function renderMini() {
    miniTitle.textContent = `${miniDate.getFullYear()}년 ${miniDate.getMonth() + 1}월`;
    const tk = todayKey();
    let html = WEEKDAYS.map((w) => `<div class="wd">${w}</div>`).join("");
    miniGrid.innerHTML = html;
    monthCells(miniDate).forEach((d) => {
      const k = key(d);
      const b = document.createElement("button");
      b.textContent = d.getDate();
      if (d.getMonth() !== miniDate.getMonth()) b.classList.add("out");
      if (k === tk) b.classList.add("today");
      else if (k === selectedKey) b.classList.add("sel");
      if (eventsOn(k).length) b.classList.add("has");
      b.addEventListener("click", () => {
        selectedKey = k;
        viewDate = new Date(d.getFullYear(), d.getMonth(), 1);
        render();
      });
      miniGrid.appendChild(b);
    });
  }

  function renderUpcoming() {
    const tk = todayKey();
    const list = events
      .filter((e) => e.date >= tk && matches(e))
      .sort((a, b) => (a.date + (a.start || "")).localeCompare(b.date + (b.start || "")))
      .slice(0, 8);

    upcomingList.innerHTML = "";
    if (!list.length) {
      upcomingList.innerHTML = `<div class="empty">${query ? "검색 결과가 없습니다." : "예정된 일정이 없습니다."}</div>`;
      return;
    }
    list.forEach((e) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.innerHTML = `<span class="dot"></span><span><span class="t"></span><span class="m"></span></span>`;
      b.querySelector(".dot").style.background = colorHex(e.color);
      b.querySelector(".t").textContent = e.title || "(제목 없음)";
      b.querySelector(".m").textContent =
        `${e.date === tk ? "오늘" : fmtDateLong(e.date)}${e.allDay ? " · 종일" : " · " + fmtTime(e.start)}`;
      b.addEventListener("click", () => {
        viewDate = parseKey(e.date);
        selectedKey = e.date;
        render();
        openEdit(e.id);
      });
      li.appendChild(b);
      upcomingList.appendChild(li);
    });
  }

  // ---------- Google Calendar 설정 ----------
  function updateGoogleSettingsUI() {
    googleClientIdInput.value = googleConfig.clientId || "";
    googleCalendarIdInput.value = googleConfig.calendarId || "primary";
    const btn = $("#googleConnectBtn");
    const disconnectBtn = $("#googleDisconnectBtn");
    if (googleConfig.connected) {
      googleStatusEl.textContent = `연결됨 · ${googleConfig.calendarId || "primary"}`;
      btn.textContent = "다시 연결";
      disconnectBtn.style.display = "inline-block";
    } else {
      googleStatusEl.textContent = "연결 전입니다.";
      btn.textContent = "Google 연결";
      disconnectBtn.style.display = "inline-block";
    }
  }

  function showGoogleStatus(message) {
    googleStatusEl.textContent = message;
  }

  async function importGoogleEvents(calendarId) {
    if (!googleAccessToken) throw new Error("인증 토큰이 없습니다.");
    const timeMin = new Date().toISOString();
    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calendarId)}/events?maxResults=20&singleEvents=true&orderBy=startTime&timeMin=${encodeURIComponent(timeMin)}`;
    const response = await fetch(url, { headers: { Authorization: `Bearer ${googleAccessToken}` } });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error?.message || "Google Calendar 조회에 실패했습니다.");

    const existingIds = new Set(events.filter((e) => e.googleEventId).map((e) => e.googleEventId));
    const imported = (data.items || [])
      .filter((item) => item && item.status !== "cancelled")
      .map((item) => {
        const start = item.start || {};
        const end = item.end || {};
        const allDay = Boolean(start.date);
        const date = start.date || (start.dateTime || "").slice(0, 10) || todayKey();
        const startTime = start.dateTime ? start.dateTime.slice(11, 16) : "";
        const endTime = end.dateTime ? end.dateTime.slice(11, 16) : "";
        return {
          id: uid(),
          title: item.summary || "(제목 없음)",
          date,
          allDay,
          start: allDay ? "" : startTime,
          end: allDay ? "" : endTime,
          color: "blue",
          desc: item.description || item.location || "",
          googleEventId: item.id,
          googleCalendarId: calendarId
        };
      })
      .filter((e) => !existingIds.has(e.googleEventId));

    if (imported.length) {
      events = [...events, ...imported];
      save();
      render();
    }
    return imported;
  }

  async function connectGoogleCalendar() {
    googleConfig.clientId = (googleClientIdInput.value || "").trim();
    googleConfig.calendarId = (googleCalendarIdInput.value || "").trim() || "primary";
    saveGoogleConfig();

    if (!googleConfig.clientId) {
      showGoogleStatus("Google API Client ID를 입력해 주세요.");
      return;
    }
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
      showGoogleStatus("Google SDK를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.");
      return;
    }

    console.log("🔐 Google OAuth 시작:", { clientId: googleConfig.clientId, calendarId: googleConfig.calendarId });
    showGoogleStatus("Google 계정으로 인증 중...");

    if (!googleTokenClient) {
      googleTokenClient = window.google.accounts.oauth2.initTokenClient({
        client_id: googleConfig.clientId,
        scope: "https://www.googleapis.com/auth/calendar",
        callback: async (resp) => {
          console.log("📱 OAuth 콜백 응답:", resp.error ? `에러: ${resp.error}` : "성공");
          if (resp.error) {
            showGoogleStatus(`연결 실패: ${resp.error}`);
            console.error("❌ OAuth 에러:", resp.error);
            return;
          }
          googleAccessToken = resp.access_token;
          console.log("✅ 액세스 토큰 획득 완료");
          try {
            const imported = await importGoogleEvents(googleConfig.calendarId);
            googleConfig.connected = true;
            saveGoogleConfig();
            updateGoogleSettingsUI();
            showGoogleStatus(imported.length ? `연동 완료: ${imported.length}개의 일정을 가져왔습니다.` : "연동 완료: 새 일정이 없습니다.");
            console.log("✅ Google Calendar 연동 완료");
          } catch (err) {
            showGoogleStatus(err.message || "Google Calendar 연동 중 오류가 발생했습니다.");
            console.error("❌ 연동 오류:", err);
          }
        }
      });
    }

    try {
      console.log("🔓 requestAccessToken 호출 중...");
      googleTokenClient.requestAccessToken({ prompt: "consent" });
      console.log("✅ requestAccessToken 호출 완료");
    } catch (err) {
      console.error("❌ requestAccessToken 에러:", err);
      showGoogleStatus(`OAuth 요청 실패: ${err.message}`);
    }
  }

  function disconnectGoogleCalendar() {
    googleAccessToken = null;
    googleConfig.connected = false;
    saveGoogleConfig();
    updateGoogleSettingsUI();
    showGoogleStatus("연결이 해제되었습니다.");
  }

  // Google Calendar에 이벤트 생성
  async function createGoogleEvent(event) {
    if (!googleAccessToken || !googleConfig.connected || !googleConfig.calendarId) {
      console.log("Google 이벤트 생성 스킵:", { hasToken: !!googleAccessToken, connected: googleConfig.connected, calendarId: googleConfig.calendarId });
      return;
    }
    try {
      const startDateTime = event.allDay 
        ? { date: event.date }
        : { dateTime: `${event.date}T${event.start || "09:00"}:00`, timeZone: "Asia/Seoul" };
      const endDateTime = event.allDay
        ? { date: event.date }
        : { dateTime: `${event.date}T${event.end || "10:00"}:00`, timeZone: "Asia/Seoul" };

      const eventData = {
        summary: event.title,
        description: event.desc,
        start: startDateTime,
        end: endDateTime,
        colorId: COLORS.findIndex((c) => c.id === event.color) || 0
      };

      const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(googleConfig.calendarId)}/events`;
      console.log("Google 이벤트 생성 중:", event.title);
      const response = await fetch(url, {
        method: "POST",
        headers: { 
          Authorization: `Bearer ${googleAccessToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(eventData)
      });
      const result = await response.json();
      if (response.ok && result.id) {
        event.googleEventId = result.id;
        event.googleCalendarId = googleConfig.calendarId;
        console.log("✅ Google 이벤트 생성 성공:", result.id);
        return result.id;
      } else if (!response.ok) {
        console.error("❌ Google 이벤트 생성 실패:", response.status, result.error?.message);
      }
    } catch (err) {
      console.error("❌ Google 이벤트 생성 오류:", err);
    }
  }

  // Google Calendar에서 이벤트 수정
  async function updateGoogleEvent(event) {
    if (!event.googleEventId || !googleAccessToken || !googleConfig.connected) {
      console.log("Google 이벤트 수정 스킵:", { hasGoogleId: !!event.googleEventId, hasToken: !!googleAccessToken, connected: googleConfig.connected });
      return;
    }
    try {
      const startDateTime = event.allDay 
        ? { date: event.date }
        : { dateTime: `${event.date}T${event.start || "09:00"}:00`, timeZone: "Asia/Seoul" };
      const endDateTime = event.allDay
        ? { date: event.date }
        : { dateTime: `${event.date}T${event.end || "10:00"}:00`, timeZone: "Asia/Seoul" };

      const eventData = {
        summary: event.title,
        description: event.desc,
        start: startDateTime,
        end: endDateTime,
        colorId: COLORS.findIndex((c) => c.id === event.color) || 0
      };

      const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(event.googleCalendarId || googleConfig.calendarId)}/events/${encodeURIComponent(event.googleEventId)}`;
      console.log("Google 이벤트 수정 중:", event.title, event.googleEventId);
      const response = await fetch(url, {
        method: "PATCH",
        headers: { 
          Authorization: `Bearer ${googleAccessToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(eventData)
      });
      if (!response.ok) {
        const result = await response.json();
        console.error("❌ Google 이벤트 수정 실패:", response.status, result.error?.message);
      } else {
        console.log("✅ Google 이벤트 수정 성공:", event.googleEventId);
      }
    } catch (err) {
      console.error("❌ Google 이벤트 수정 오류:", err);
    }
  }

  // Google Calendar에서 이벤트 삭제
  async function deleteGoogleEvent(event) {
    if (!event.googleEventId || !googleAccessToken || !googleConfig.connected) {
      console.log("Google 이벤트 삭제 스킵:", { hasGoogleId: !!event.googleEventId, hasToken: !!googleAccessToken, connected: googleConfig.connected });
      return;
    }
    try {
      const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(event.googleCalendarId || googleConfig.calendarId)}/events/${encodeURIComponent(event.googleEventId)}`;
      console.log("Google 이벤트 삭제 중:", event.googleEventId);
      const response = await fetch(url, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${googleAccessToken}` }
      });
      if (!response.ok) {
        const result = await response.json();
        console.error("❌ Google 이벤트 삭제 실패:", response.status, result.error?.message);
      } else {
        console.log("✅ Google 이벤트 삭제 성공:", event.googleEventId);
      }
    } catch (err) {
      console.error("❌ Google 이벤트 삭제 오류:", err);
    }
  }

  // ---------- 편집 모달 ----------
  const fTitle = $("#f-title"), fAllDay = $("#f-allday"), fDate = $("#f-date");
  const fStart = $("#f-start"), fEnd = $("#f-end"), fDesc = $("#f-desc"), fError = $("#f-error");
  const deleteBtn = $("#deleteBtn");

  $("#f-colors").innerHTML = COLORS
    .map((c) => `<button type="button" role="radio" aria-checked="false" data-color="${c.id}" title="${c.name}" style="background:${c.hex}"></button>`)
    .join("");
  $("#f-colors").addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-color]");
    if (b) { formColor = b.dataset.color; paintColors(); }
  });
  function paintColors() {
    $("#f-colors").querySelectorAll("button").forEach((b) => {
      b.setAttribute("aria-checked", String(b.dataset.color === formColor));
    });
  }

  function syncAllDay() {
    const on = fAllDay.checked;
    $("#startWrap").style.display = on ? "none" : "";
    $("#endWrap").style.display = on ? "none" : "";
  }
  fAllDay.addEventListener("change", syncAllDay);

  function openEdit(id, dateKey) {
    editingId = id || null;
    fError.textContent = "";
    const e = id ? events.find((x) => x.id === id) : null;

    if (e) {
      $("#editTitle").textContent = "일정 수정";
      fTitle.value = e.title || "";
      fAllDay.checked = !!e.allDay;
      fDate.value = e.date;
      fStart.value = e.start || "09:00";
      fEnd.value = e.end || "10:00";
      fDesc.value = e.desc || "";
      formColor = e.color || "blue";
      deleteBtn.hidden = false;
    } else {
      const now = new Date();
      const s = roundTime(now);
      $("#editTitle").textContent = "일정 추가";
      fTitle.value = "";
      fAllDay.checked = false;
      fDate.value = dateKey || selectedKey || todayKey();
      fStart.value = s;
      fEnd.value = plusHour(s);
      fDesc.value = "";
      formColor = "blue";
      deleteBtn.hidden = true;
    }
    paintColors();
    syncAllDay();
    open(editBackdrop);
    setTimeout(() => fTitle.focus(), 30);
  }

  $("#editForm").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const title = fTitle.value.trim();
    if (!fDate.value) { fError.textContent = "날짜를 입력해 주세요."; return; }
    if (!fAllDay.checked) {
      if (!fStart.value || !fEnd.value) { fError.textContent = "시작/종료 시간을 입력해 주세요."; return; }
      if (fEnd.value <= fStart.value) { fError.textContent = "종료 시간은 시작 시간보다 뒤여야 합니다."; return; }
    }
    const data = {
      title: title || "(제목 없음)",
      date: fDate.value,
      allDay: fAllDay.checked,
      start: fAllDay.checked ? "" : fStart.value,
      end: fAllDay.checked ? "" : fEnd.value,
      color: formColor,
      desc: fDesc.value.trim()
    };
    if (editingId) {
      const e = events.find((x) => x.id === editingId);
      const wasAllDay = e.allDay;
      const oldDate = e.date;
      Object.assign(e, data);
      // Google Calendar에 동기화 (이벤트가 Google에서 온 것일 경우)
      updateGoogleEvent(e);
    } else {
      const newEvent = Object.assign({ id: uid() }, data);
      events.push(newEvent);
      // 새 이벤트를 Google Calendar에도 생성
      createGoogleEvent(newEvent);
    }
    selectedKey = data.date;
    save();
    close(editBackdrop);
    render();
  });

  deleteBtn.addEventListener("click", () => {
    if (!editingId) return;
    const e = events.find((x) => x.id === editingId);
    if (e) {
      // Google Calendar에서도 삭제 (이벤트가 Google에서 온 것일 경우)
      deleteGoogleEvent(e);
    }
    events = events.filter((x) => x.id !== editingId);
    save();
    close(editBackdrop);
    render();
  });

  // ---------- 하루 목록 모달 ----------
  let dayKeyOpen = null;
  function openDay(k) {
    dayKeyOpen = k;
    $("#dayTitle").textContent = fmtDateLong(k);
    const ul = $("#dayList");
    ul.innerHTML = "";
    eventsOn(k).forEach((e) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.innerHTML = `<span class="dot"></span><span><span class="t"></span><br><span class="m"></span></span>`;
      b.querySelector(".dot").style.background = colorHex(e.color);
      b.querySelector(".t").textContent = e.title || "(제목 없음)";
      b.querySelector(".m").textContent = e.allDay ? "종일" : `${fmtTime(e.start)} – ${fmtTime(e.end)}`;
      b.addEventListener("click", () => { close(dayBackdrop); openEdit(e.id); });
      li.appendChild(b);
      ul.appendChild(li);
    });
    open(dayBackdrop);
  }
  $("#dayAddBtn").addEventListener("click", () => { close(dayBackdrop); openEdit(null, dayKeyOpen); });

  // ---------- 모달 공통 ----------
  function open(el) { el.classList.add("open"); }
  function close(el) { el.classList.remove("open"); }
  document.querySelectorAll("[data-close]").forEach((b) =>
    b.addEventListener("click", () => close(b.closest(".backdrop")))
  );
  [editBackdrop, dayBackdrop, settingsBackdrop].forEach((bd) =>
    bd.addEventListener("mousedown", (ev) => { if (ev.target === bd) close(bd); })
  );

  // ---------- 툴바 ----------
  $("#prevBtn").addEventListener("click", () => { viewDate = addMonths(viewDate, -1); miniDate = new Date(viewDate); render(); });
  $("#nextBtn").addEventListener("click", () => { viewDate = addMonths(viewDate, 1); miniDate = new Date(viewDate); render(); });
  $("#todayBtn").addEventListener("click", () => {
    viewDate = new Date(); miniDate = new Date(); selectedKey = todayKey(); render();
  });
  $("#miniPrev").addEventListener("click", () => { miniDate = addMonths(miniDate, -1); renderMini(); });
  $("#miniNext").addEventListener("click", () => { miniDate = addMonths(miniDate, 1); renderMini(); });
  $("#createBtn").addEventListener("click", () => openEdit(null, selectedKey));
  $("#profileBtn").addEventListener("click", () => { updateGoogleSettingsUI(); open(settingsBackdrop); });
  $("#search").addEventListener("input", (ev) => { query = ev.target.value.trim(); render(); });
  $("#googleConnectBtn").addEventListener("click", () => { connectGoogleCalendar(); });
  $("#googleDisconnectBtn").addEventListener("click", () => { disconnectGoogleCalendar(); });

  // ---------- 단축키 ----------
  document.addEventListener("keydown", (ev) => {
    if (!currentUser) return;           // 로그인 화면에서는 단축키를 받지 않는다
    const openBd = document.querySelector(".backdrop.open");
    if (ev.key === "Escape" && openBd) { close(openBd); return; }
    if (openBd) {
      // 편집 중에는 ⌘/Ctrl+Enter 로 저장
      if ((ev.metaKey || ev.ctrlKey) && ev.key === "Enter" && openBd === editBackdrop) {
        ev.preventDefault();
        $("#editForm").requestSubmit();
      }
      return;
    }
    const tag = (ev.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") return;
    if (ev.key === "ArrowLeft") $("#prevBtn").click();
    else if (ev.key === "ArrowRight") $("#nextBtn").click();
    else if (ev.key === "t" || ev.key === "ㅅ") $("#todayBtn").click();
    else if (ev.key === "n" || ev.key === "ㅜ") { ev.preventDefault(); openEdit(null, selectedKey); }
  });

  // ---------- 계정 저장소 ----------
  // 계정은 이 브라우저의 localStorage 에만 저장된다. 서버 인증이 아니므로
  // 로컬 데이터를 분리해 주는 용도이지, 기기를 공유하는 사람으로부터 지켜 주지는 못한다.
  function loadUsers() {
    try {
      const raw = localStorage.getItem(USERS_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      if (parsed && typeof parsed === "object") return parsed;
    } catch (e) {}
    return {};
  }
  function saveUsers(users) {
    try { localStorage.setItem(USERS_KEY, JSON.stringify(users)); return true; }
    catch (e) { return false; }
  }

  const toHex = (buf) =>
    Array.from(new Uint8Array(buf)).map((b) => pad(b.toString(16))).join("");

  function randomSalt() {
    const a = new Uint8Array(16);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
    else for (let i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256);
    return toHex(a.buffer);
  }

  const PBKDF2_ITER = 120000;

  // 보안 컨텍스트(https/localhost)에서는 PBKDF2, file:// 처럼 crypto.subtle 이 없는
  // 환경에서는 반복 해시로 대체한다. 대체 방식은 강도가 훨씬 약하다.
  async function hashPassword(password, salt) {
    if (window.crypto && crypto.subtle) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]
      );
      const bits = await crypto.subtle.deriveBits(
        { name: "PBKDF2", salt: enc.encode(salt), iterations: PBKDF2_ITER, hash: "SHA-256" },
        keyMaterial, 256
      );
      return { algo: "PBKDF2-SHA256", hash: toHex(bits) };
    }
    let h1 = 0x811c9dc5, h2 = 0x01000193;
    const s = salt + "␀" + password;
    for (let round = 0; round < 5000; round++) {
      for (let i = 0; i < s.length; i++) {
        h1 = Math.imul(h1 ^ s.charCodeAt(i), 16777619) >>> 0;
        h2 = Math.imul(h2 + s.charCodeAt(i) + round, 2246822519) >>> 0;
      }
    }
    return { algo: "fallback-v1", hash: pad(h1.toString(16)) + pad(h2.toString(16)) };
  }

  // 길이가 달라도 조기 반환하지 않는 비교
  function safeEqual(a, b) {
    if (typeof a !== "string" || typeof b !== "string") return false;
    let diff = a.length ^ b.length;
    for (let i = 0; i < Math.max(a.length, b.length); i++) {
      diff |= (a.charCodeAt(i) || 0) ^ (b.charCodeAt(i) || 0);
    }
    return diff === 0;
  }

  const normId = (s) => s.trim().toLowerCase();
  const ID_RE = /^[a-z0-9_]{3,20}$/;

  // ---------- 세션 ----------
  function readSession() {
    try {
      return localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY);
    } catch (e) { return null; }
  }
  function writeSession(id, keep) {
    try {
      (keep ? localStorage : sessionStorage).setItem(SESSION_KEY, id);
      (keep ? sessionStorage : localStorage).removeItem(SESSION_KEY);
    } catch (e) {}
  }
  function clearSession() {
    try { localStorage.removeItem(SESSION_KEY); sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
  }

  // ---------- 인증 화면 ----------
  const authScreen = $("#authScreen"), appEl = $("#app");
  const loginForm = $("#loginForm"), signupForm = $("#signupForm");
  const tabLogin = $("#tabLogin"), tabSignup = $("#tabSignup");
  const liId = $("#li-id"), liPw = $("#li-pw"), liKeep = $("#li-keep"), liError = $("#li-error");
  const suId = $("#su-id"), suPw = $("#su-pw"), suPw2 = $("#su-pw2"), suError = $("#su-error");

  function showTab(which) {
    const login = which === "login";
    tabLogin.setAttribute("aria-selected", String(login));
    tabSignup.setAttribute("aria-selected", String(!login));
    loginForm.hidden = !login;
    signupForm.hidden = login;
    liError.textContent = "";
    suError.textContent = "";
    setTimeout(() => (login ? liId : suId).focus(), 30);
  }
  tabLogin.addEventListener("click", () => showTab("login"));
  tabSignup.addEventListener("click", () => showTab("signup"));

  function busy(form, on, label) {
    const btn = form.querySelector("button[type=submit]");
    btn.disabled = on;
    if (on) { btn.dataset.label = btn.textContent; btn.textContent = label; }
    else if (btn.dataset.label) btn.textContent = btn.dataset.label;
  }

  signupForm.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const id = normId(suId.value);
    const pw = suPw.value;

    if (!ID_RE.test(id)) { suError.textContent = "아이디는 영문 소문자·숫자·밑줄 3~20자여야 합니다."; return; }
    if (pw.length < 6) { suError.textContent = "비밀번호는 6자 이상이어야 합니다."; return; }
    if (pw !== suPw2.value) { suError.textContent = "비밀번호가 서로 다릅니다."; return; }

    const users = loadUsers();
    if (users[id]) { suError.textContent = "이미 사용 중인 아이디입니다."; return; }

    busy(signupForm, true, "가입 중…");
    try {
      const salt = randomSalt();
      const { algo, hash } = await hashPassword(pw, salt);
      users[id] = { id, salt, hash, algo, iter: PBKDF2_ITER, createdAt: new Date().toISOString() };
      if (!saveUsers(users)) {
        suError.textContent = "브라우저 저장소에 접근할 수 없어 가입할 수 없습니다.";
        return;
      }
      adoptLegacyEvents(id);
      suPw.value = suPw2.value = "";
      enterApp(id, true);
    } finally {
      busy(signupForm, false);
    }
  });

  loginForm.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const id = normId(liId.value);
    const pw = liPw.value;
    const user = loadUsers()[id];

    busy(loginForm, true, "확인 중…");
    try {
      // 아이디가 없어도 같은 비용을 치러 존재 여부가 드러나지 않게 한다.
      const { hash } = await hashPassword(pw, user ? user.salt : "unknown-user-salt");
      if (!user || !safeEqual(hash, user.hash)) {
        liError.textContent = "아이디 또는 비밀번호가 올바르지 않습니다.";
        liPw.select();
        return;
      }
      liPw.value = "";
      liError.textContent = "";
      enterApp(id, liKeep.checked);
    } finally {
      busy(loginForm, false);
    }
  });

  // 로그인 도입 이전에 쌓인 일정을 첫 계정이 이어받는다.
  function adoptLegacyEvents(id) {
    try {
      const legacy = localStorage.getItem(LEGACY_STORE_KEY);
      if (!legacy) return;
      if (!localStorage.getItem(storeKeyFor(id))) localStorage.setItem(storeKeyFor(id), legacy);
      localStorage.removeItem(LEGACY_STORE_KEY);
    } catch (e) {}
  }

  // ---------- 앱 진입 / 종료 ----------
  function enterApp(id, keep) {
    currentUser = id;
    writeSession(id, keep);

    $("#userName").textContent = id;
    $("#userAvatar").textContent = id.slice(0, 1).toUpperCase();

    events = load();
    save();                              // seed() 로 시작한 경우 즉시 계정에 귀속
    viewDate = new Date();
    miniDate = new Date();
    selectedKey = todayKey();
    query = "";
    $("#search").value = "";

    authScreen.hidden = true;
    appEl.hidden = false;
    render();
  }

  function logout() {
    document.querySelectorAll(".backdrop.open").forEach(close);
    clearSession();
    currentUser = null;
    events = [];
    editingId = null;
    appEl.hidden = true;
    authScreen.hidden = false;
    liPw.value = "";
    showTab("login");
  }
  $("#logoutBtn").addEventListener("click", logout);

  // ---------- 시작 ----------
  (function boot() {
    updateGoogleSettingsUI();
    const users = loadUsers();
    const hasAccounts = Object.keys(users).length > 0;
    if (!hasAccounts) {
      $("#authSub").textContent = "먼저 계정을 만들면 내 일정만 따로 보관됩니다.";
      showTab("signup");
    } else {
      showTab("login");
    }
    const sessionId = readSession();
    if (sessionId && users[sessionId]) {
      liId.value = sessionId;
      enterApp(sessionId, !!localStorage.getItem(SESSION_KEY));
    }
  })();
})();
</script>
</body>
</html>
