<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=./calendar.html" />
  <title>캘린더로 이동</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f8fc;
      color: #202124;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .box {
      background: white;
      padding: 24px 28px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    a {
      color: #1a73e8;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>캘린더로 이동 중입니다</h1>
    <p>잠시 후 자동으로 열립니다.</p>
    <a href="./calendar.html">바로 열기</a>
  </div>
</body>
</html>
