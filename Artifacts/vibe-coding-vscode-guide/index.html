<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar Planner</title>
  <style>
    :root {
      --bg: #f3f6ff;
      --panel: #ffffff;
      --panel-soft: #f8faff;
      --text: #172033;
      --muted: #74809b;
      --line: #e4eaf7;
      --accent: #5b7cff;
      --accent-2: #25b8c7;
      --danger: #ff6b6b;
      --ok: #26b978;
      --shadow: 0 18px 40px rgba(25, 39, 77, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      background: linear-gradient(135deg, #eef3ff 0%, #f9fbff 100%);
      color: var(--text);
    }

    .app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .sidebar {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
    }

    .pill {
      background: rgba(91, 124, 255, 0.11);
      color: var(--accent);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .today-box {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: white;
      border-radius: 18px;
      padding: 18px;
    }

    .today-box p { margin: 4px 0; opacity: 0.95; }
    .today-box strong { font-size: 22px; }

    form {
      display: grid;
      gap: 10px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    input, select, textarea, button {
      font: inherit;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text);
    }

    textarea { min-height: 72px; resize: vertical; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .actions { display: flex; gap: 10px; }

    button {
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-primary { background: var(--accent); color: white; }
    .btn-secondary { background: #eef2ff; color: var(--accent); }
    .btn-danger { background: #fff0f0; color: var(--danger); }

    .list-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .list-title h3 { margin: 0; font-size: 16px; }

    .events-list {
      display: grid;
      gap: 10px;
    }

    .event-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #fcfdff;
    }

    .event-item.done {
      opacity: 0.7;
    }

    .event-item.done .title { text-decoration: line-through; }

    .event-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: start;
    }

    .title { font-weight: 700; margin-bottom: 4px; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      margin-top: 6px;
    }

    .badge.work { background: #eef2ff; color: var(--accent); }
    .badge.personal { background: #ecfbf5; color: var(--ok); }
    .badge.study { background: #fff6e8; color: #b87c00; }

    .event-actions { display: flex; gap: 6px; }
    .tiny { padding: 6px 8px; font-size: 12px; }

    .main {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .topbar h2 { margin: 0; font-size: 24px; }
    .topbar p { margin: 4px 0 0; color: var(--muted); }

    .nav-group { display: flex; gap: 8px; }
    .nav-group button { background: #f5f8ff; color: var(--text); }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .weekday {
      text-align: center;
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
      padding-bottom: 6px;
    }

    .day-cell {
      min-height: 112px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .day-cell:hover { transform: translateY(-2px); border-color: #cfd8f2; }
    .day-cell.other-month { opacity: 0.5; }
    .day-cell.selected {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 2px rgba(91, 124, 255, 0.14);
      background: #f7f9ff;
    }
    .day-cell.today {
      background: linear-gradient(135deg, rgba(91, 124, 255, 0.12) 0%, rgba(37, 184, 199, 0.1) 100%);
    }

    .day-number {
      font-weight: 700;
      font-size: 14px;
    }

    .day-chip {
      background: white;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 7px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .day-chip.more { color: var(--accent); background: #eef3ff; }

    .muted { color: var(--muted); }

    @media (max-width: 960px) {
      .app { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .app { padding: 14px; }
      .calendar { gap: 8px; }
      .day-cell { min-height: 92px; padding: 8px; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="card sidebar">
      <div class="brand">
        <h1>Calendar Planner</h1>
        <span class="pill">Google 캘린더 느낌</span>
      </div>

      <div class="today-box">
        <p>오늘</p>
        <strong id="todayLabel"></strong>
        <p id="todaySummary"></p>
      </div>

      <form id="eventForm">
        <input type="hidden" id="eventId" />
        <div class="row">
          <label>
            날짜
            <input type="date" id="eventDate" required />
          </label>
          <label>
            시간
            <input type="time" id="eventTime" />
          </label>
        </div>

        <label>
          제목
          <input type="text" id="eventTitle" placeholder="예: 팀 회의" required />
        </label>

        <label>
          카테고리
          <select id="eventCategory">
            <option value="work">업무</option>
            <option value="personal">개인</option>
            <option value="study">학습</option>
          </select>
        </label>

        <label>
          메모
          <textarea id="eventNote" placeholder="추가 메모를 적어보세요"></textarea>
        </label>

        <label>
          <input type="checkbox" id="eventDone" /> 완료 표시
        </label>

        <div class="actions">
          <button type="submit" class="btn-primary">저장</button>
          <button type="button" id="clearBtn" class="btn-secondary">초기화</button>
        </div>
      </form>

      <div class="list-title">
        <h3 id="selectedDateLabel">선택된 일정</h3>
      </div>
      <div id="eventsList" class="events-list"></div>
    </aside>

    <main class="card main">
      <div class="topbar">
        <div>
          <h2 id="monthLabel">월</h2>
          <p>일정을 클릭해서 수정하고, 새 일정을 추가해 보세요.</p>
        </div>
        <div class="nav-group">
          <button id="prevBtn">← 이전</button>
          <button id="todayBtn">오늘</button>
          <button id="nextBtn">다음 →</button>
        </div>
      </div>

      <div class="calendar" id="calendarGrid"></div>
    </main>
  </div>

  <script>
    const STORAGE_KEY = 'calendar-planner-events-v1';
    const weekdays = ['일', '월', '화', '수', '목', '금', '토'];

    const initialEvents = [
      { id: crypto.randomUUID(), date: getDateKey(new Date()), title: '프로젝트 리뷰', time: '09:00', category: 'work', note: '팀 미팅 준비', done: false },
      { id: crypto.randomUUID(), date: getDateKey(new Date(new Date().setDate(new Date().getDate() + 1))), title: '운동', time: '19:30', category: 'personal', note: '러닝 30분', done: false },
      { id: crypto.randomUUID(), date: getDateKey(new Date(new Date().setDate(new Date().getDate() + 2))), title: 'JavaScript 복습', time: '20:00', category: 'study', note: '배열 함수 복습', done: true }
    ];

    const state = {
      currentDate: new Date(),
      selectedDate: new Date(),
      events: loadEvents()
    };

    const form = document.getElementById('eventForm');
    const eventIdInput = document.getElementById('eventId');
    const dateInput = document.getElementById('eventDate');
    const timeInput = document.getElementById('eventTime');
    const titleInput = document.getElementById('eventTitle');
    const categoryInput = document.getElementById('eventCategory');
    const noteInput = document.getElementById('eventNote');
    const doneInput = document.getElementById('eventDone');
    const calendarGrid = document.getElementById('calendarGrid');
    const monthLabel = document.getElementById('monthLabel');
    const todayLabel = document.getElementById('todayLabel');
    const todaySummary = document.getElementById('todaySummary');
    const selectedDateLabel = document.getElementById('selectedDateLabel');
    const eventsList = document.getElementById('eventsList');

    function loadEvents() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          return JSON.parse(stored);
        }
      } catch (error) {
        console.warn('저장소를 불러오지 못했습니다.', error);
      }
      return initialEvents;
    }

    function saveEvents() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.events));
    }

    function getDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDateLabel(date) {
      return new Intl.DateTimeFormat('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' }).format(date);
    }

    function formatMonthLabel(date) {
      return new Intl.DateTimeFormat('ko-KR', { year: 'numeric', month: 'long' }).format(date);
    }

    function getEventsForDate(dateKey) {
      return state.events.filter(event => event.date === dateKey).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
    }

    function render() {
      renderCalendar();
      renderEvents();
      renderToday();
      updateFormDate();
    }

    function renderToday() {
      const today = new Date();
      todayLabel.textContent = formatDateLabel(today);
      const count = getEventsForDate(getDateKey(today)).length;
      todaySummary.textContent = count > 0 ? `오늘 일정 ${count}개가 있어요.` : '오늘 등록된 일정이 없습니다.';
    }

    function renderCalendar() {
      const year = state.currentDate.getFullYear();
      const month = state.currentDate.getMonth();
      monthLabel.textContent = formatMonthLabel(state.currentDate);

      const firstDay = new Date(year, month, 1);
      const startDay = firstDay.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const prevDays = new Date(year, month, 0).getDate();

      const cells = [];
      for (let i = startDay - 1; i >= 0; i -= 1) {
        const day = prevDays - i;
        cells.push(createDayCell(new Date(year, month - 1, day), true));
      }

      for (let day = 1; day <= daysInMonth; day += 1) {
        cells.push(createDayCell(new Date(year, month, day), false));
      }

      while (cells.length % 7 !== 0) {
        const nextDay = cells.length % 7 + 1;
        cells.push(createDayCell(new Date(year, month + 1, nextDay), true));
      }

      calendarGrid.innerHTML = weekdays.map(day => `<div class="weekday">${day}</div>`).join('') + cells.map(cell => cell).join('');
    }

    function createDayCell(date, isOtherMonth) {
      const key = getDateKey(date);
      const events = getEventsForDate(key);
      const isToday = key === getDateKey(new Date());
      const isSelected = key === getDateKey(state.selectedDate);
      const visibleEvents = events.slice(0, 3);
      const extraCount = events.length > 3 ? `+${events.length - 3}` : '';

      return `
        <button class="day-cell ${isOtherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" data-date="${key}">
          <div class="day-number">${date.getDate()}</div>
          ${visibleEvents.map(event => `<div class="day-chip">${event.title}</div>`).join('')}
          ${extraCount ? `<div class="day-chip more">${extraCount}</div>` : ''}
        </button>
      `;
    }

    function renderEvents() {
      const key = getDateKey(state.selectedDate);
      selectedDateLabel.textContent = `${formatDateLabel(state.selectedDate)}의 일정`;
      const items = getEventsForDate(key);

      if (items.length === 0) {
        eventsList.innerHTML = '<p class="muted">이 날짜에는 일정이 없습니다.</p>';
        return;
      }

      eventsList.innerHTML = items.map(event => `
        <div class="event-item ${event.done ? 'done' : ''}">
          <div class="event-top">
            <div>
              <div class="title">${escapeHtml(event.title)}</div>
              <div class="meta">${event.time ? `${event.time} · ` : ''}${escapeHtml(event.note || '')}</div>
            </div>
            <div class="event-actions">
              <button class="tiny btn-secondary" data-action="edit" data-id="${event.id}">수정</button>
              <button class="tiny btn-danger" data-action="delete" data-id="${event.id}">삭제</button>
            </div>
          </div>
          <span class="badge ${event.category}">${categoryLabel(event.category)}</span>
        </div>
      `).join('');
    }

    function categoryLabel(category) {
      switch (category) {
        case 'work': return '업무';
        case 'personal': return '개인';
        case 'study': return '학습';
        default: return '기타';
      }
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function updateFormDate() {
      dateInput.value = getDateKey(state.selectedDate);
      form.reset();
      dateInput.value = getDateKey(state.selectedDate);
      eventIdInput.value = '';
      doneInput.checked = false;
      categoryInput.value = 'work';
    }

    function fillForm(event) {
      eventIdInput.value = event.id;
      dateInput.value = event.date;
      timeInput.value = event.time || '';
      titleInput.value = event.title;
      categoryInput.value = event.category;
      noteInput.value = event.note || '';
      doneInput.checked = !!event.done;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const id = eventIdInput.value;
      const newEvent = {
        id: id || crypto.randomUUID(),
        date: dateInput.value,
        time: timeInput.value,
        title: titleInput.value.trim(),
        category: categoryInput.value,
        note: noteInput.value.trim(),
        done: doneInput.checked
      };

      if (!newEvent.title) return;

      if (id) {
        state.events = state.events.map(item => item.id === id ? newEvent : item);
      } else {
        state.events.push(newEvent);
      }

      saveEvents();
      state.selectedDate = new Date(`${newEvent.date}T12:00:00`);
      render();
      form.reset();
      dateInput.value = getDateKey(state.selectedDate);
      eventIdInput.value = '';
      categoryInput.value = 'work';
      doneInput.checked = false;
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      form.reset();
      dateInput.value = getDateKey(state.selectedDate);
      eventIdInput.value = '';
      categoryInput.value = 'work';
      doneInput.checked = false;
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      state.currentDate = new Date(state.currentDate.getFullYear(), state.currentDate.getMonth() - 1, 1);
      render();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      state.currentDate = new Date(state.currentDate.getFullYear(), state.currentDate.getMonth() + 1, 1);
      render();
    });

    document.getElementById('todayBtn').addEventListener('click', () => {
      state.currentDate = new Date();
      state.selectedDate = new Date();
      render();
    });

    calendarGrid.addEventListener('click', (event) => {
      const button = event.target.closest('[data-date]');
      if (!button) return;
      state.selectedDate = new Date(`${button.dataset.date}T12:00:00`);
      state.currentDate = new Date(state.selectedDate.getFullYear(), state.selectedDate.getMonth(), 1);
      render();
    });

    eventsList.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      const id = button.getAttribute('data-id');
      if (button.dataset.action === 'delete') {
        state.events = state.events.filter(eventItem => eventItem.id !== id);
        saveEvents();
        render();
      } else if (button.dataset.action === 'edit') {
        const item = state.events.find(eventItem => eventItem.id === id);
        if (item) {
          fillForm(item);
          state.selectedDate = new Date(`${item.date}T12:00:00`);
          state.currentDate = new Date(state.selectedDate.getFullYear(), state.selectedDate.getMonth(), 1);
          render();
        }
      }
    });

    render();
  </script>
</body>
</html>
