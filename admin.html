<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>회원 관리</title>
<link rel="stylesheet" href="base.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>
<div class="admin" id="adminScreen">
  <div class="admin-shell">
    <div class="admin-header">
      <div>
        <h1>회원 관리</h1>
        <p>관리자 전용 화면입니다. 회원 정보를 수정하고 가입을 승인할 수 있습니다. 캘린더는 별도 페이지입니다.</p>
      </div>
      <div class="admin-actions">
        <button class="btn" id="backToCalendarBtn" type="button">캘린더로 돌아가기</button>
        <button class="btn primary" id="logoutAdminBtn" type="button">로그아웃</button>
      </div>
    </div>

    <div class="admin-card">
      <form id="adminUserForm" autocomplete="off">
        <div class="admin-grid">
          <div class="field">
            <label for="adminUserId">아이디</label>
            <input class="input" id="adminUserId" maxlength="20" placeholder="영문·숫자·밑줄 3~20자" required />
          </div>
          <div class="field">
            <label for="adminUserPw">비밀번호</label>
            <input class="input" id="adminUserPw" type="password" placeholder="6자 이상" required />
          </div>
        </div>
        <div class="admin-grid" style="margin-top:8px">
          <div class="field">
            <label for="adminUserPw2">비밀번호 확인</label>
            <input class="input" id="adminUserPw2" type="password" placeholder="비밀번호 재입력" required />
          </div>
          <div class="field">
            <label for="adminUserRole">권한</label>
            <select class="input" id="adminUserRole">
              <option value="member">일반회원</option>
              <option value="admin">관리자</option>
            </select>
          </div>
        </div>
        <div class="admin-grid" style="margin-top:8px">
          <div class="field">
            <label for="adminUserApproved">승인 상태</label>
            <select class="input" id="adminUserApproved">
              <option value="yes">승인됨 · 로그인 가능</option>
              <option value="no">승인 대기 · 로그인 불가</option>
            </select>
          </div>
          <div class="field" style="justify-content:flex-end">
            <button class="btn" id="adminFormResetBtn" type="button">새로 입력</button>
          </div>
        </div>
        <div class="admin-error" id="adminError"></div>
        <button class="btn primary" type="submit">회원 저장</button>
      </form>
    </div>

    <div class="admin-card">
      <h2 style="margin:0 0 12px">승인 대기 <span class="pill" id="adminPendingCount">0명</span></h2>
      <div class="admin-list" id="adminPendingList"></div>
    </div>

    <div class="admin-card">
      <h2 style="margin:0 0 12px">회원 목록</h2>
      <div class="admin-list" id="adminUserList"></div>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
(function () {
  "use strict";
  const $ = (sel) => document.querySelector(sel);
  const {
    loadUsers, createOrUpdateUser, deleteUser, setUserApproval,
    isAdminUser, isApprovedUser, normId, ID_RE, readSession, clearSession
  } = window.CalAuth;

  const CALENDAR_PAGE = "calendar.html";

  // 관리자가 아니면 이 페이지에 머무를 이유가 없다. 캘린더(=로그인 화면)로 돌려보낸다.
  const currentUser = readSession();
  if (!currentUser || !isAdminUser(currentUser)) {
    location.replace(CALENDAR_PAGE);
    return;
  }

  const adminUserForm = $("#adminUserForm"), adminError = $("#adminError");
  const adminUserId = $("#adminUserId"), adminUserPw = $("#adminUserPw"), adminUserPw2 = $("#adminUserPw2");
  const adminUserRole = $("#adminUserRole"), adminUserApproved = $("#adminUserApproved");
  const adminUserList = $("#adminUserList"), adminPendingList = $("#adminPendingList");
  const adminPendingCount = $("#adminPendingCount");

  function busy(form, on, label) {
    const btn = form.querySelector("button[type=submit]");
    btn.disabled = on;
    if (on) { btn.dataset.label = btn.textContent; btn.textContent = label; }
    else if (btn.dataset.label) btn.textContent = btn.dataset.label;
  }

  // ---------- 회원 관리 화면 ----------
  function adminRow(id, user) {
    const isAdmin = id === "siaoni" || user?.isAdmin === true;
    const approved = isApprovedUser(id, user);
    const row = document.createElement("div");
    row.className = "admin-row";
    row.innerHTML = `
      <div class="meta">
        <div>
          <strong>${id}</strong>
          ${isAdmin ? ' <span class="pill">관리자</span>' : ""}
          ${approved ? "" : ' <span class="pill">승인 대기</span>'}
        </div>
        <div style="font-size:12px;color:var(--text-2)">비밀번호: ${user?.password || "— (본인이 설정)"}</div>
        <div style="font-size:12px;color:var(--text-2)">${user?.createdAt ? new Date(user.createdAt).toLocaleString("ko-KR") : ""}</div>
      </div>
      <div class="admin-actions">
        <button class="btn" type="button" data-edit="${id}">수정</button>
        ${approved
          ? `<button class="btn" type="button" data-revoke="${id}" ${isAdmin ? "disabled" : ""}>승인 취소</button>`
          : `<button class="btn primary" type="button" data-approve="${id}">승인</button>`}
        <button class="btn" type="button" data-delete="${id}" ${isAdmin ? "disabled" : ""}>삭제</button>
      </div>
    `;
    return row;
  }

  function renderAdminUserList() {
    const users = loadUsers();
    const rows = Object.entries(users).sort(([a], [b]) => a.localeCompare(b));

    adminUserList.innerHTML = "";
    if (!rows.length) {
      adminUserList.innerHTML = '<div class="admin-row"><div class="meta"><strong>등록된 회원이 없습니다.</strong></div></div>';
    } else {
      rows.forEach(([id, user]) => adminUserList.appendChild(adminRow(id, user)));
    }

    const pending = rows.filter(([id, user]) => !isApprovedUser(id, user));
    adminPendingCount.textContent = `${pending.length}명`;
    adminPendingList.innerHTML = "";
    if (!pending.length) {
      adminPendingList.innerHTML = '<div class="admin-row"><div class="meta"><strong>승인을 기다리는 회원이 없습니다.</strong></div></div>';
    } else {
      pending.forEach(([id, user]) => adminPendingList.appendChild(adminRow(id, user)));
    }
  }

  function fillAdminForm(id) {
    const user = loadUsers()[id];
    if (!user) return;
    adminUserId.value = id;
    adminUserPw.value = "";
    adminUserPw2.value = "";
    adminUserRole.value = id === "siaoni" || user.isAdmin ? "admin" : "member";
    adminUserApproved.value = isApprovedUser(id, user) ? "yes" : "no";
    adminError.textContent = "비밀번호를 새로 입력해야 저장됩니다.";
    adminUserPw.focus();
  }

  function resetAdminForm() {
    adminUserForm.reset();
    adminUserRole.value = "member";
    adminUserApproved.value = "yes";
    adminError.textContent = "";
  }

  function handleAdminRowClick(ev) {
    const btn = ev.target.closest("button[data-edit], button[data-approve], button[data-revoke], button[data-delete]");
    if (!btn) return;

    if (btn.hasAttribute("data-edit")) {
      fillAdminForm(btn.getAttribute("data-edit"));
      return;
    }

    if (btn.hasAttribute("data-approve") || btn.hasAttribute("data-revoke")) {
      const approve = btn.hasAttribute("data-approve");
      const id = btn.getAttribute(approve ? "data-approve" : "data-revoke");
      try {
        setUserApproval(id, approve);
        adminError.textContent = approve ? `${id} 회원을 승인했습니다.` : `${id} 회원의 승인을 취소했습니다.`;
        renderAdminUserList();
      } catch (err) {
        adminError.textContent = err.message || "승인 상태를 바꾸지 못했습니다.";
      }
      return;
    }

    const id = btn.getAttribute("data-delete");
    if (id === currentUser) {
      adminError.textContent = "현재 로그인 중인 계정은 삭제할 수 없습니다.";
      return;
    }
    if (!confirm(`${id} 회원을 삭제할까요? 되돌릴 수 없습니다.`)) return;
    deleteUser(id).then(() => {
      adminError.textContent = `${id} 회원을 삭제했습니다.`;
      renderAdminUserList();
    }).catch((err) => {
      adminError.textContent = err.message || "삭제 실패";
    });
  }

  adminUserList.addEventListener("click", handleAdminRowClick);
  adminPendingList.addEventListener("click", handleAdminRowClick);
  $("#adminFormResetBtn").addEventListener("click", resetAdminForm);

  adminUserForm.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const id = normId(adminUserId.value);
    const pw = adminUserPw.value;
    const pw2 = adminUserPw2.value;
    const role = adminUserRole.value;
    const approved = adminUserApproved.value === "yes";

    if (!ID_RE.test(id)) {
      adminError.textContent = "아이디는 영문 소문자·숫자·밑줄 3~20자여야 합니다.";
      return;
    }
    if (pw.length < 6) {
      adminError.textContent = "비밀번호는 6자 이상이어야 합니다.";
      return;
    }
    if (pw !== pw2) {
      adminError.textContent = "비밀번호가 서로 다릅니다.";
      return;
    }

    busy(adminUserForm, true, "저장 중…");
    try {
      await createOrUpdateUser(id, pw, role, approved);
      adminError.textContent = `${id} 회원을 저장했습니다.`;
      adminUserId.value = "";
      adminUserPw.value = "";
      adminUserPw2.value = "";
      adminUserRole.value = "member";
      adminUserApproved.value = "yes";
      renderAdminUserList();
    } catch (err) {
      adminError.textContent = err.message || "저장 실패";
    } finally {
      busy(adminUserForm, false);
    }
  });

  // ---------- 페이지 이동 ----------
  $("#backToCalendarBtn").addEventListener("click", () => {
    location.href = CALENDAR_PAGE;
  });
  $("#logoutAdminBtn").addEventListener("click", () => {
    clearSession();
    location.href = CALENDAR_PAGE;
  });

  resetAdminForm();
  renderAdminUserList();
})();
</script>
</body>
</html>
